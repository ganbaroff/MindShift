name: Deploy Edge Functions

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

# Only deploy edge functions after CI passes — prevents broken functions from
# deploying before TypeScript/build failures are caught.
# Note: workflow_run only fires for the default branch (main) — PRs are unaffected.

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: supabase/setup-cli@v1
        with:
          version: 2.34.3

      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          FAILED=""
          deploy() {
            local name="$1"; shift
            supabase functions deploy "$name" "$@" --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} \
              || FAILED="$FAILED $name"
          }
          deploy mochi-respond
          deploy decompose-task
          deploy recovery-message
          deploy weekly-insight
          deploy classify-voice-input
          deploy gdpr-export
          deploy gdpr-delete
          deploy telegram-webhook --no-verify-jwt
          # creator-pult: @CreatorBy_bot webhook, authed in-code by the
          # X-Telegram-Bot-Api-Secret-Token header (PULT_WEBHOOK_SECRET). No Supabase JWT.
          deploy creator-pult --no-verify-jwt
          deploy gcal-sync
          deploy gcal-store-token
          # scheduled-push is cron-invoked with a CRON_SECRET bearer (not a JWT);
          # platform JWT verification 401s every cron call, so it MUST stay no-verify-jwt.
          # Auth is enforced in-code via the CRON_SECRET check.
          deploy scheduled-push --no-verify-jwt
          # create-checkout is live as verify_jwt=false — it runs its OWN in-code JWT
          # gate (401s a request without a real user JWT) and the Telegram funnel calls
          # it directly with the anon key + a minted guest JWT. Pin --no-verify-jwt so
          # CI stops silently flipping it back to platform-verified (which would 401 the
          # funnel's final checkout turn).
          deploy create-checkout --no-verify-jwt
          deploy stripe-webhook --no-verify-jwt
          # dodo-webhook: provider callback, authenticated in-code by signature — no JWT.
          deploy dodo-webhook --no-verify-jwt
          # agent-chat: platform JWT-verified (default). Listed so CI owns it (was drifting).
          deploy agent-chat
          deploy gcal-inbound
          if [ -n "$FAILED" ]; then
            echo "::error::Failed to deploy:$FAILED"
            exit 1
          fi
