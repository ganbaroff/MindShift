name: ci-oneshot-tgsecret
# One-shot: push the freshly-minted TELEGRAM_WEBHOOK_SECRET into the Supabase edge
# function env so the auditor can forge signed webhook calls to prove idempotency +
# rate-limit fixes. Value comes from the FUNNEL_WEBHOOK_SECRET_ONESHOT repo secret
# (set via stdin), never echoed. Delete this workflow + the repo secret after use.
on:
  workflow_dispatch:

jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: 2.34.3
      - name: Set TELEGRAM_WEBHOOK_SECRET edge secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          TG_SECRET: ${{ secrets.FUNNEL_WEBHOOK_SECRET_ONESHOT }}
        run: |
          set -euo pipefail
          printf 'TELEGRAM_WEBHOOK_SECRET=%s\n' "$TG_SECRET" > /tmp/tg.env
          supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" --env-file /tmp/tg.env
          rm -f /tmp/tg.env
          echo "TELEGRAM_WEBHOOK_SECRET set (value not printed)"
