name: funnel-secrets-oneshot
on: workflow_dispatch
jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Set funnel bot secrets
        run: supabase secrets set "TELEGRAM_BOT_TOKEN=$TG_TOKEN" "TELEGRAM_WEBHOOK_SECRET=$TG_WH" --project-ref awfoqycoltvhamtrsvxk
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_FUNNEL_TOKEN_TMP }}
          TG_WH: ${{ secrets.TG_WEBHOOK_SECRET_TMP }}
      - name: Delete dead tg-admin-fix stub
        run: supabase functions delete tg-admin-fix --project-ref awfoqycoltvhamtrsvxk || true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
