name: tg-rereg-cleanup

# One-shot: deletes the throwaway tg-rereg edge function. Removed after a green run.

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Delete throwaway tg-rereg function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions delete tg-rereg --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
