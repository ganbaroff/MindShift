name: ci-oneshot-cronsecret
# One-shot: re-sync scheduled-push auth so the pg_cron caller and the edge function
# share the SAME CRON_SECRET. Generates one fresh secret inside the runner (never
# printed), sets it as the CRON_SECRET edge secret, and rewrites the cron job header
# to send `Bearer <same secret>` via the Supabase Management API (access-token auth,
# no DB password needed). Safe to delete after a green run.
on:
  workflow_dispatch:

jobs:
  resync:
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Generate secret, set edge env, rewrite cron header
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          # 1. Fresh random secret — lives only in this runner's memory.
          SECRET="$(openssl rand -hex 32)"

          # 2. Set it as the CRON_SECRET edge function secret (via env-file, not argv).
          printf 'CRON_SECRET=%s\n' "$SECRET" > /tmp/cron.env
          supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" --env-file /tmp/cron.env
          rm -f /tmp/cron.env

          # 3. Rewrite the pg_cron job header to the SAME secret via the Management API.
          #    The new cron command is embedded as a dollar-quoted ($body$) SQL literal
          #    (the secret is hex, so it can never collide with the $body$ delimiter).
          #    jq then JSON-encodes the whole SQL for the API request body; set -x is off.
          SQL=$(cat <<SQLCMD
          select cron.alter_job(
            job_id := (select jobid from cron.job where jobname = 'send-push-reminders'),
            command := \$body\$
          select net.http_post(
            url := 'https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/scheduled-push',
            headers := '{"Content-Type": "application/json", "Authorization": "Bearer ${SECRET}"}'::jsonb,
            body := '{}'::jsonb
          );
          \$body\$
          );
          SQLCMD
          )
          QUERY=$(jq -n --arg q "$SQL" '{query: $q}')

          HTTP=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$QUERY")
          echo "management-api status: $HTTP"
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then
            echo "::error::cron header rewrite failed (status $HTTP)"
            cat /tmp/resp.json
            exit 1
          fi
          echo "resync complete (secret not printed)"
