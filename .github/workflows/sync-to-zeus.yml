name: Sync to ZEUS Gateway

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  notify-zeus:
    name: Notify ZEUS — MindShift changed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Build change summary
        id: summary
        env:
          ACTOR: ${{ github.actor }}
        run: |
          # GITHUB_OUTPUT is line-based: the value must contain no newlines
          COMMITS=$(git log --oneline -5 --format="%h %s" | tr '\n' ';')
          FILES_CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | head -20 | tr '\n' ',')
          SUMMARY="MindShift push to main by ${ACTOR}. Commits: ${COMMITS} Files: ${FILES_CHANGED}"
          SUMMARY=$(printf '%s' "${SUMMARY:0:500}" | tr -d '\r\n')
          echo "summary=${SUMMARY}" >> "$GITHUB_OUTPUT"

      - name: POST to ZEUS /event
        if: ${{ vars.ZEUS_GATEWAY_URL != '' }}
        env:
          ZEUS_URL: ${{ vars.ZEUS_GATEWAY_URL }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SECRET }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          SUMMARY: ${{ steps.summary.outputs.summary }}
        run: |
          # jq guarantees valid JSON even when commit messages contain quotes
          PAYLOAD=$(jq -n --arg actor "$ACTOR" --arg sha "$SHA" --arg summary "$SUMMARY" \
            '{source: "github-mindshift", event: "push.main", severity: "P2",
              payload: {repo: "MindShift", actor: $actor, sha: $sha, summary: $summary}}')
          HTTP_CODE=$(curl -sS --max-time 15 -o /tmp/zeus_resp.txt -w '%{http_code}' \
            -X POST "$ZEUS_URL/event" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GATEWAY_SECRET" \
            -d "$PAYLOAD") || HTTP_CODE=000
          echo "ZEUS responded HTTP ${HTTP_CODE}"
          cat /tmp/zeus_resp.txt 2>/dev/null || true
          # non-blocking by design: gateway downtime must not redden MindShift CI
