<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap');
html,body{margin:0;width:1080px;height:1920px}
.card{width:1080px;height:1920px;background:
   radial-gradient(40% 30% at 50% 40%, rgba(99,180,199,.14), transparent 60%), #0C1826;
   display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'IBM Plex Sans',sans-serif;color:#EAF1F7}
.mark{display:flex;align-items:center;gap:22px;margin-bottom:52px}
.mark svg{width:44px;height:106px;color:#63B4C7}
.mark .name{font-size:74px;font-weight:700;letter-spacing:6px}
.big{font-size:88px;font-weight:700;color:#63B4C7;margin:0}
.sub{font-size:40px;color:#8FA6BC;margin-top:18px;letter-spacing:1px}
.ig{margin-top:64px;font-size:38px;color:#EAF1F7;display:flex;align-items:center;gap:16px;opacity:.92}
.igbox{width:52px;height:52px;border:3px solid #63B4C7;border-radius:14px;display:grid;place-items:center}
.igbox::after{content:"";width:22px;height:22px;border:3px solid #63B4C7;border-radius:50%}
</style></head><body>
  <div class="card">
    <div class="mark"><svg viewBox="0 0 20 48"><path d="M 0 0 H 20 V 6 H 14 V 42 H 20 V 48 H 0 V 42 H 6 V 6 H 0 Z" fill="currentColor"/></svg><span class="name">INTEGRONIX</span></div>
    <p class="big">Bizə yazın</p>
    <p class="sub">sorğu göndərin — pulsuz audit</p>
    <div class="ig"><span class="igbox"></span><span>@integronix</span></div>
  </div>
</body></html>
