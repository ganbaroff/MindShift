<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0A1420}
  .stage{position:relative;width:1080px;height:1920px;
    background:
      radial-gradient(38% 30% at 50% 26%, rgba(99,180,199,.22), transparent 62%),
      radial-gradient(30% 26% at 16% 74%, rgba(74,143,163,.16), transparent 60%),
      radial-gradient(20% 18% at 84% 20%, rgba(99,180,199,.10), transparent 60%),
      #0A1420;}
  .bokeh{position:absolute;border-radius:50%;filter:blur(7px)}
  .b1{left:72%;top:80%;width:120px;height:120px;background:rgba(99,180,199,.10)}
  .b2{left:14%;top:20%;width:80px;height:80px;background:rgba(74,143,163,.12)}
  .b3{left:80%;top:60%;width:60px;height:60px;background:rgba(99,180,199,.08)}
  .wrapp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
  .phone{width:726px;height:1290px;border-radius:60px;background:#05090F;
    border:3px solid #1b2634;box-shadow:0 70px 130px -30px rgba(0,0,0,.9), 0 0 0 13px #0c1017;
    padding:15px;position:relative}
  .notch{position:absolute;left:50%;top:24px;transform:translateX(-50%);width:172px;height:28px;background:#05090F;border-radius:0 0 18px 18px;z-index:3}
  .screen{width:100%;height:100%;border-radius:40px;overflow:hidden;position:relative;background:#0C1826}
  .screen video{width:100%;height:100%;object-fit:cover;display:block}
  .glare{position:absolute;inset:0;border-radius:40px;background:linear-gradient(120deg, rgba(255,255,255,.06) 0%, transparent 34%);pointer-events:none;z-index:2}
  @keyframes float{
    0%,100%{transform:rotateY(-9deg) rotateX(3deg) translateY(6px)}
    50%{transform:rotateY(-6.5deg) rotateX(2deg) translateY(-16px)}
  }
</style></head>
<body>
  <div class="stage">
    <div class="bokeh b1"></div><div class="bokeh b2"></div><div class="bokeh b3"></div>
    <div class="wrapp"><div class="phone">
      <div class="notch"></div>
      <div class="screen"><video id="v" src="demo3.mp4" muted playsinline></video><div class="glare"></div></div>
    </div></div>
  </div>
</body></html>
